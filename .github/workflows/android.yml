name: Android wrapper

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "components/pwa/MobileAppSettings.tsx"
      - "tests/android-wrapper.test.mjs"
      - "tests/apk-download.test.mjs"
      - "package.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "components/pwa/MobileAppSettings.tsx"
      - "tests/android-wrapper.test.mjs"
      - "tests/apk-download.test.mjs"
      - "package.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Validate Android wrapper contracts
        run: npm run test:android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Lint and compile debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Publish Gradle diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f android/android-build.log ]]; then
            {
              echo "## Android build diagnostics"
              echo '```text'
              tail -n 120 android/android-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            reason="$(awk '
              /\* What went wrong:/ { capture = 1; next }
              /\* Try:/ { capture = 0 }
              capture && NF { print }
            ' android/android-build.log | head -n 24 | tr '\n' ';' | head -c 3000)"
            if [[ -z "$reason" ]]; then
              reason="$(tail -n 60 android/android-build.log | tr '\n' ';' | head -c 3000)"
            fi
            reason="${reason//'%'/'%25'}"
            echo "::error title=Android Gradle build failed::${reason:-See the Android build diagnostics in the workflow summary.}"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gatepath-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gatepath-android-build-log
          path: android/android-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish-preview:
    name: Publish immutable Android preview
    needs: validate-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check whether the preview already exists
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view android-preview-v1 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the compiled APK
        if: steps.preview.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: gatepath-debug-apk
          path: preview-apk

      - name: Publish the preview APK
        if: steps.preview.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          apk_path="$(find preview-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" gatepath-android.apk
          sha256sum gatepath-android.apk > gatepath-android.apk.sha256
          gh release create android-preview-v1 \
            gatepath-android.apk \
            gatepath-android.apk.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "GatePath Android Preview v1" \
            --notes "Preview build for direct Android installation.

          This APK opens gatepath.vercel.app as a Trusted Web Activity and includes adaptive monochrome launcher artwork for supported Android 13+ launchers, including Pixel Launcher and compatible Samsung One UI versions.

          Important: this first preview is debug-signed. Android may require uninstalling it before a future production-signed build can be installed. Remove an older Chrome-installed GatePath PWA first if you want to avoid duplicate launcher icons."
