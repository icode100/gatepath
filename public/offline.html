<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>GatePath · Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display:grid; min-height:100svh; margin:0; padding:24px; place-items:center; color:#f5f7ff; background:#0b1020; }
      main { width:min(100%,430px); padding:32px; border:1px solid #27334b; border-radius:24px; background:#131c31; box-shadow:0 24px 70px #0006; }
      img { width:54px; height:54px; }
      span { display:block; margin-top:26px; color:#91a2ff; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
      h1 { margin:7px 0 12px; font-family:Georgia,serif; font-size:38px; font-weight:500; line-height:1.05; }
      p { margin:0; color:#9aa6bc; line-height:1.65; }
      a { display:grid; width:100%; min-height:48px; margin-top:26px; border-radius:12px; place-items:center; color:white; background:#4056d6; font-size:14px; font-weight:700; text-decoration:none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <span>Connection paused</span>
      <h1>GatePath is waiting for the internet.</h1>
      <p>Your account and progress are safe. Reconnect to load live questions, scoring, analytics, and synced notes.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
