plugins {
    id "com.android.application"
}

android {
    namespace "com.icode100.gatepath"
    // Android Browser Helper 2.7.x depends on AndroidX artifacts whose AAR
    // metadata requires API 36 and Android Gradle Plugin 8.9.1 or newer.
    compileSdk 36

    defaultConfig {
        applicationId "com.icode100.gatepath"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.2"
}
