name: gatepath-2027

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatepath}
      POSTGRES_USER: ${POSTGRES_USER:-gatepath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatepath_dev_password}
    volumes:
      - gatepath_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-gatepath}:${POSTGRES_PASSWORD:-gatepath_dev_password}@database:5432/${POSTGRES_DB:-gatepath}}
      CORS_ORIGINS: http://localhost:3000
      AUTO_CREATE_DB: "false"
      SEED_DATA: "true"
      AUTO_IMPORT_QUESTION_BANK: "true"
      QUESTION_BANK_PATH: data/question_bank.json
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ANONYMOUS_IDENTITY_SECRET: ${ANONYMOUS_IDENTITY_SECRET:-gatepath-local-dev-secret-change-before-public-deployment}
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); raise SystemExit(0 if data['status'] == 'ok' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  gatepath_postgres:
